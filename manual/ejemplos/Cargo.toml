[package]
name = "workflow-forge-manual"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace]
members = ["modulo-saludos"]

[dependencies]
workflow-forge = { path = "../../crates/forge", default-features = false, features = ["sqlite", "integrations"] }
modulo-saludos = { path = "modulo-saludos" }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }

