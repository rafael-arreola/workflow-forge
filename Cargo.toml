[workspace]
resolver = "3"
members = ["crates/core"]

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
jsonpath-rust = "1.0.4"
jsonschema = "0.28"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
schemars = "1.2.1"
