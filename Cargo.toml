[workspace]
resolver = "3"
members = ["crates/forge", "crates/protocol", "crates/engine", "crates/modules", "crates/conformance", "examples/reference-module", "examples/authoring-client", "examples/host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rafael-arreola/workflow-forge"
homepage = "https://github.com/rafael-arreola/workflow-forge"
keywords = ["workflow", "orchestration", "json", "integration", "declarative"]
categories = ["asynchronous"]

[workspace.dependencies]
workflow-forge-protocol = { path = "crates/protocol", version = "0.1.0" }
workflow-forge-engine = { path = "crates/engine", version = "0.1.0" }
workflow-forge-modules = { path = "crates/modules", version = "0.1.0" }
workflow-forge = { path = "crates/forge", version = "0.1.0" }

futures = "0.3"
jsonschema = "0.46"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "rustls",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v5", "v7"] }
