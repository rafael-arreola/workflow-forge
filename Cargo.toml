[workspace]
resolver = "3"
members = ["crates/core", "crates/extensions/*", "crates/forge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rafael-arreola/workflow-forge"

[workspace.dependencies]
workflow-forge-core = { path = "crates/core", version = "0.1.0" }
workflow-forge-ext-util = { path = "crates/extensions/util", version = "0.1.0" }
workflow-forge-ext-data = { path = "crates/extensions/data", version = "0.1.0" }
workflow-forge-ext-http = { path = "crates/extensions/http", version = "0.1.0" }
workflow-forge-ext-tabular = { path = "crates/extensions/tabular", version = "0.1.0" }
workflow-forge-ext-sftp = { path = "crates/extensions/sftp", version = "0.1.0" }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
futures = "0.3"
jsonpath-rust = "1.0.4"
jsonschema = "0.46 "
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "charset",
    "rustls",
    "form",
    "multipart",
    "stream",
] }
httpmock = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
schemars = "1.2.1"
