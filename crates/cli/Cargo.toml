[package]
name = "workflow-forge-cli"
description = "HTTP client for Workflow Forge: author, start and inspect declarative workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
workflow-forge-protocol = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
workflow-forge = { path = "../forge", default-features = false, features = ["sqlite", "integrations"] }
workflow-forge-service = { path = "../service" }
