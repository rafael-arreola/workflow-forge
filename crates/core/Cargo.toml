[package]
name = "workflow-forge-core"
description = "Core of workflow-forge: a declarative JSON workflow engine (spec, executor, validation, manifest, BlobStore)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Mock tasks + dry-run helpers (the `testing` module) for exercising workflows
# without live dependencies. Off by default; enable in `[dev-dependencies]`.
testing = []

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
jsonpath-rust = { workspace = true }
jsonschema = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
schemars = { workspace = true }
