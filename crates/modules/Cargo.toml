[package]
name = "workflow-forge-modules"
description = "Official operations and infrastructure providers for Workflow Forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
sqlite = ["dep:rusqlite", "dep:fs2", "dep:sha2", "dep:serde", "dep:tokio"]
integrations = ["dep:reqwest", "dep:csv", "dep:cap-std", "dep:sha2", "dep:serde", "dep:tokio"]

[dependencies]
workflow-forge-protocol = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rusqlite = { version = "0.39", default-features = false, features = ["bundled", "limits", "fallible_uint"], optional = true }
fs2 = { version = "0.4.3", optional = true }
sha2 = { version = "0.10", optional = true }
reqwest = { workspace = true, optional = true }
csv = { version = "1.4", optional = true }
cap-std = { version = "4", optional = true }

[dev-dependencies]
workflow-forge-conformance = { path = "../conformance" }
