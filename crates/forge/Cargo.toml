[package]
name = "workflow-forge"
description = "Declarative integration engine with JSON Schema contracts, explicit bindings and recoverable workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["integrations"]
full = ["sqlite", "integrations"]
sqlite = ["workflow-forge-modules/sqlite"]
integrations = ["workflow-forge-modules/integrations"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "v2_sqlite"
required-features = ["sqlite"]

[[example]]
name = "v2_signal"
required-features = ["sqlite"]

[dependencies]
workflow-forge-protocol = { workspace = true }
workflow-forge-engine = { workspace = true }
workflow-forge-modules = { workspace = true }

[dev-dependencies]
workflow-forge-conformance = { path = "../conformance" }
workflow-forge-reference-module = { path = "../../examples/reference-module" }
jsonschema = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"
