[package]
name = "workflow-forge"
description = "Declarative integration engine with JSON Schema contracts, explicit bindings and recoverable workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/workflow-forge"
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["integrations"]
full = ["sqlite", "integrations"]
sqlite = ["workflow-forge-modules/sqlite"]
integrations = ["workflow-forge-modules/integrations"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
workflow-forge-protocol = { workspace = true }
workflow-forge-engine = { workspace = true }
workflow-forge-modules = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
