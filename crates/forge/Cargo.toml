[package]
name = "workflow-forge"
description = "A declarative, JSON-based workflow engine for Rust — defined with JSON Schema, wired with JSONPath, executed by an embeddable async core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["util", "data", "http", "integrations"]
full = ["util", "data", "http", "tabular", "sftp", "compress", "sqlite", "integrations"]
sqlite = ["workflow-forge-modules/sqlite"]
integrations = ["workflow-forge-modules/integrations"]
util = ["dep:workflow-forge-ext-util"]
data = ["dep:workflow-forge-ext-data"]
http = ["dep:workflow-forge-ext-http"]
tabular = ["dep:workflow-forge-ext-tabular"]
sftp = ["dep:workflow-forge-ext-sftp"]
compress = ["dep:workflow-forge-ext-compress"]
# Mock tasks + dry-run helpers for testing workflows without live dependencies.
testing = ["workflow-forge-core/testing"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "v2_sqlite"
required-features = ["sqlite"]

[[example]]
name = "v2_signal"
required-features = ["sqlite"]

[dependencies]
workflow-forge-protocol = { workspace = true }
workflow-forge-engine = { workspace = true }
workflow-forge-modules = { workspace = true }
workflow-forge-core = { workspace = true }
workflow-forge-ext-util = { workspace = true, optional = true }
workflow-forge-ext-data = { workspace = true, optional = true }
workflow-forge-ext-http = { workspace = true, optional = true }
workflow-forge-ext-tabular = { workspace = true, optional = true }
workflow-forge-ext-sftp = { workspace = true, optional = true }
workflow-forge-ext-compress = { workspace = true, optional = true }

[dev-dependencies]
workflow-forge-conformance = { path = "../conformance" }
workflow-forge-reference-module = { path = "../../examples/reference-module" }
jsonschema = { workspace = true }
futures = { workspace = true }
httpmock = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
