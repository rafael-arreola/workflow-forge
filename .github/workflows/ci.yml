name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

  sftp-integration:
    name: integración sftp (servidor real)
    runs-on: ubuntu-latest
    services:
      sftp:
        image: atmoz/sftp
        ports:
          - 2222:22
        env:
          SFTP_USERS: demo:demo:::upload
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests ignorados de sftp
        env:
          WF_SFTP_HOST: localhost
          WF_SFTP_PORT: "2222"
          WF_SFTP_USER: demo
          WF_SFTP_PASSWORD: demo
          WF_SFTP_DIR: /upload
        run: cargo test -p workflow-forge-ext-sftp -- --ignored
