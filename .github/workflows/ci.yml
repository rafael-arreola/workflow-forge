name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify libraries, documentation and proofs of concept
        run: ./scripts/check.sh

      - name: Verify release archives
        run: >-
          cargo package --workspace
          --exclude workflow-forge-examples
          --exclude workflow-forge-reference-module
          --exclude workflow-forge-authoring-example
          --all-features --locked
